<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#059669" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NutriFuture" />
  <meta name="color-scheme" content="light" />
  <title>NutriFuture — Dinh dưỡng học đường thông minh</title>
  <meta name="description" content="NutriFuture giúp học sinh THPT tra cứu dinh dưỡng, phân tích món ăn bằng AI, theo dõi nhật ký và cá nhân hóa mục tiêu dinh dưỡng." />
  <meta name="robots" content="index,follow" />
  <link rel="canonical" href="https://QuocHung2008.github.io/NutriFuture/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWAaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/theme-boost.css" />
  <link rel="stylesheet" href="css/audit-overrides.css" />
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <div class="bg-decor__grid"></div><div class="bg-decor__blob bg-decor__blob--1"></div><div class="bg-decor__blob bg-decor__blob--2"></div><div class="bg-decor__blob bg-decor__blob--3"></div><div class="bg-decor__blob bg-decor__blob--4"></div>
  </div>
  <header id="app-header"><div class="header-inner">
    <a class="logo" href="#home" title="Về trang chủ" aria-label="NutriFuture — Trang chủ"><div class="logo__icon"><i class="fa-solid fa-leaf" aria-hidden="true"></i></div><div class="logo__text">Nutri<span>Future</span></div></a>
    <nav class="desktop-nav" aria-label="Điều hướng chính">
      <button class="nav-btn desktop-nav__btn active" data-target="#home"><i class="fa-solid fa-house" aria-hidden="true"></i><span>Trang chủ</span></button>
      <button class="nav-btn desktop-nav__btn" data-target="#lookup"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><span>Tra cứu</span></button>
      <button class="nav-btn desktop-nav__btn" data-target="#camera"><i class="fa-solid fa-camera-retro" aria-hidden="true"></i><span>Camera AI</span></button>
      <button class="nav-btn desktop-nav__btn" data-target="#diary"><i class="fa-solid fa-book-open" aria-hidden="true"></i><span>Nhật ký</span></button>
      <button class="nav-btn desktop-nav__btn" data-target="#history"><i class="fa-solid fa-chart-pie" aria-hidden="true"></i><span>Báo cáo</span></button>
      <button class="nav-btn desktop-nav__btn" data-target="#profile"><i class="fa-solid fa-user-graduate" aria-hidden="true"></i><span>Hồ sơ</span></button>
    </nav>
    <div class="header-actions"><a href="#history" class="header-date" title="Xem lịch sử & báo cáo"><i class="fa-solid fa-chart-pie" aria-hidden="true"></i><span>Báo cáo</span></a><a href="#profile" class="header-date" aria-label="Mở hồ sơ cá nhân" title="Hồ sơ cá nhân"><i class="fa-solid fa-user-gear" aria-hidden="true"></i></a></div>
  </div></header>
  <main id="app-content" role="main" tabindex="-1"><div class="loading-container" style="padding:var(--sp-8) 0;"><div class="loading-spinner"></div><p class="loading-text">Đang khởi chạy NutriFuture AI...</p></div></main>
  <nav id="bottom-nav" aria-label="Điều hướng chính trên điện thoại">
    <button class="nav-btn active" data-target="#home"><i class="fa-solid fa-house" aria-hidden="true"></i><span>Trang chủ</span></button>
    <button class="nav-btn" data-target="#lookup"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><span>Tra cứu</span></button>
    <button class="nav-btn nav-btn--camera" data-target="#camera"><div class="nav-btn__icon-wrap"><i class="fa-solid fa-camera" aria-hidden="true"></i></div><span>Camera AI</span></button>
    <button class="nav-btn" data-target="#diary"><i class="fa-solid fa-book-open" aria-hidden="true"></i><span>Nhật ký</span></button>
    <button class="nav-btn" data-target="#profile"><i class="fa-solid fa-user-graduate" aria-hidden="true"></i><span>Hồ sơ</span></button>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="Hộp thoại"><div class="modal-content" id="modal-content"></div></div>
  <script src="js/config.js" onerror=""></script>
  <script src="js/storage.js"></script><script src="js/gemini.js"></script><script src="js/ui.js"></script><script src="js/motion.js"></script>
  <script src="js/pages/home.js"></script><script src="js/pages/camera.js"></script><script src="js/pages/lookup.js"></script><script src="js/pages/profile.js"></script><script src="js/pages/diary.js"></script><script src="js/pages/history.js"></script>
  <script src="js/home-enhancement.js"></script><script src="js/app.js"></script>
</body></html>
