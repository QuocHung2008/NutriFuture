<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Content-Security-Policy: giới hạn script/style/font/ảnh/kết nối mạng chỉ tới các
       nguồn đã biết trước (self + CDN dùng trong app + API Gemini). LƯU Ý: script-src vẫn
       phải bật 'unsafe-inline' vì giao diện dùng thuộc tính onclick="..." trực tiếp trong
       HTML ở rất nhiều nơi (kiến trúc vanilla-JS render bằng chuỗi HTML) — nếu tắt sẽ hỏng
       toàn bộ nút bấm trong app. Vì vậy CSP này KHÔNG chặn được việc một payload XSS tiêm
       qua thuộc tính onerror/onclick thực thi — lớp phòng thủ chính cho việc đó là escape
       toàn bộ dữ liệu không tin cậy trước khi chèn vào innerHTML (xem NF_UI.escapeHtml).
       Giá trị thực sự của CSP ở đây là chặn exfiltration: dù mã độc có chạy được, nó cũng
       không thể tải script từ domain lạ (script-src) hay gửi dữ liệu ra ngoài qua
       fetch/XHR/ảnh tới domain không nằm trong connect-src/img-src bên dưới. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
    font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
    img-src 'self' data: blob:;
    connect-src 'self' https://generativelanguage.googleapis.com;
    manifest-src 'self';
    worker-src 'self';
    base-uri 'self';
    form-action 'self';
    frame-ancestors 'none';
    object-src 'none';
  " />

  <meta name="theme-color" content="#f3f9fb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="NutriFuture" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Chống "chớp" sáng/tối (FOUC): đặt data-theme lên <html> TRƯỚC khi CSS được tải.
       Theo yêu cầu, theme MẶC ĐỊNH luôn là SÁNG cho lần ghé đầu tiên — không còn dò
       prefers-color-scheme của hệ thống. Chỉ khi người dùng đã tự chuyển sang tối
       (lưu trong localStorage) thì mới khởi động ở chế độ tối. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('nf_theme');
        document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>

  <title>NutriFuture — AI Dinh Dưỡng Học Đường THPT</title>
  <meta name="description" content="NutriFuture — Ứng dụng AI phân tích và tư vấn dinh dưỡng học đường cho học sinh THPT, tích hợp Google Gemini Vision & Text API." />

  <!-- PWA: Manifest & Icons -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Preconnect & Fonts: Space Grotesk (tiêu đề hình học, khoa học) + Inter (thân bài, sạch, dễ đọc) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />

  <!-- Icons: Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- AOS (Animate On Scroll) — dùng cho phần khung tĩnh (header/nav) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" />

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- Design System (một file duy nhất) -->
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

  <!-- App Header -->
  <header id="app-header">
    <div class="header-inner">
      <div class="logo" onclick="location.hash='#home'" title="Về trang chủ" data-aos="fade-right" data-aos-duration="500">
        <div class="logo__icon">
          <i class="fa-solid fa-bowl-food"></i>
        </div>
        <div class="logo__text">Nutri<span>Future</span></div>
      </div>

      <div class="header-actions" data-aos="fade-left" data-aos-duration="500">
        <button id="btn-theme-toggle" class="header-date" title="Chuyển giao diện sáng/tối" aria-label="Chuyển giao diện sáng/tối">
          <i class="fa-solid fa-moon" id="theme-toggle-icon"></i>
        </button>
        <a href="#history" class="header-date" title="Xem lịch sử &amp; báo cáo">
          <i class="fa-solid fa-chart-column"></i>
          <span>Báo cáo</span>
        </a>
        <a href="#profile" class="header-date" title="Hồ sơ cá nhân" aria-label="Hồ sơ cá nhân">
          <i class="fa-solid fa-user-gear"></i>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Viewport Content Container (SPA Router target) -->
  <main id="app-content" role="main">
    <div class="loading-container">
      <div class="loading-spinner"></div>
      <p class="loading-text">Đang khởi chạy NutriFuture AI...</p>
    </div>
  </main>

  <!-- Navigation: thanh dưới trên điện thoại, thanh bên trên máy tính -->
  <nav id="bottom-nav" aria-label="Điều hướng chính">
    <button class="nav-btn active" data-target="#home" title="Trang chủ">
      <i class="fa-solid fa-house"></i>
      <span>Trang chủ</span>
    </button>

    <button class="nav-btn" data-target="#lookup" title="Tra cứu">
      <i class="fa-solid fa-magnifying-glass"></i>
      <span>Tra cứu</span>
    </button>

    <button class="nav-btn nav-btn--camera" data-target="#camera" title="Camera AI">
      <div class="nav-btn__icon-wrap">
        <i class="fa-solid fa-camera"></i>
      </div>
      <span>Camera AI</span>
    </button>

    <button class="nav-btn" data-target="#diary" title="Nhật ký">
      <i class="fa-solid fa-book-open"></i>
      <span>Nhật ký</span>
    </button>

    <button class="nav-btn" data-target="#profile" title="Hồ sơ">
      <i class="fa-solid fa-user-graduate"></i>
      <span>Hồ sơ</span>
    </button>
  </nav>

  <!-- Global Toast Notification Container -->
  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <!-- Global Modal Overlay Container -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-content" id="modal-content">
      <!-- Injected dynamically by NF_UI.showModal() -->
    </div>
  </div>

  <!-- Scripts -->
  <!-- 1. Configuration (Optional external config, gitignored) -->
  <script src="js/config.js" onerror="/* config.js is optional if user enters key in UI */"></script>

  <!-- 2. Core Modules -->
  <script src="js/storage.js"></script>
  <script src="js/gemini.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/notifications.js"></script>

  <!-- 2b. Lớp chuyển động nâng cao: GSAP + ScrollTrigger (hiệu ứng vào trang / cuộn trang),
       AOS (reveal phần khung tĩnh header/nav), canvas-confetti (ăn mừng), particles.js
       (nền hạt "hologram"). Đặt ngay trước motion.js — nếu một CDN lỗi/mạng bị chặn,
       NF_Motion tự kiểm tra và bỏ qua, phần còn lại của app không bị ảnh hưởng. -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script src="js/motion.js"></script>

  <!-- 3. Page Modules -->
  <script src="js/pages/home.js"></script>
  <script src="js/pages/camera.js"></script>
  <script src="js/pages/lookup.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/pages/diary.js"></script>
  <script src="js/pages/history.js"></script>

  <!-- 4. App Controller -->
  <script src="js/app.js"></script>

  <!-- 5. PWA: Đăng ký Service Worker để chạy offline (không cache lệnh gọi AI) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
          console.warn('[SW] Đăng ký thất bại:', err);
        });
      });
    }
  </script>
</body>
</html>
